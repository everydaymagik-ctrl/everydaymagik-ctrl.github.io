  var KEY_STORE = "vk";
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0);}); };
  var f = document.getElementById("f"), p = document.getElementById("p"),
      b = document.getElementById("b"), msg = document.getElementById("msg");

  async function open(rawKey){
    var key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, key, b64(D.ct));
    var bundle = JSON.parse(new TextDecoder().decode(pt));
    var realFetch = window.fetch.bind(window);
    window.fetch = function(u, o){
      var k = typeof u === "string" ? u.replace(/^\.\//, "").split("?")[0] : "";
      if (bundle.files && Object.prototype.hasOwnProperty.call(bundle.files, k)) {
        return Promise.resolve(new Response(bundle.files[k], {status:200, headers:{"Content-Type":"application/json"}}));
      }
      return realFetch(u, o);
    };
    document.open(); document.write(bundle.html); document.close();
  }

  async function derive(pass){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits(
      {name:"PBKDF2", hash:"SHA-256", salt:b64(D.salt), iterations:D.iter}, base, 256);
    return new Uint8Array(bits);
  }

  var fails = 0;
  f.addEventListener("submit", async function(e){
    e.preventDefault();
    if (!window.crypto || !crypto.subtle){ msg.textContent = "Secure (https) connection required."; return; }
    b.disabled = true; msg.textContent = "";
    try {
      var raw = await derive(p.value.trim());
      await open(raw);
      try { sessionStorage.setItem(KEY_STORE, btoa(String.fromCharCode.apply(null, raw))); } catch(_){}

      fails++;
      msg.textContent = "Wrong code.";
      p.value = ""; p.focus();
      await new Promise(function(r){ setTimeout(r, Math.min(30000, 1000 * Math.pow(2, fails - 1))); });
      b.disabled = false;
    }
  });

  var saved = null;
  try { saved = sessionStorage.getItem(KEY_STORE); } catch(_){}
  if (saved) open(b64(saved)).catch(function(){ try{sessionStorage.removeItem(KEY_STORE);}catch(_){} });
